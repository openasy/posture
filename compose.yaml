# Posture. CI sends SARIF reports from Trivy, kubescape, checkov or Prowler and gets back whether the check passes (ADR 0045).
#
#   openssl rand -hex 32 > openasy-kek   # posture's key: sign-in secrets (ADR 0021). Keep it with your backups
#   docker compose up -d
#   docker compose logs posture | grep 'no owner yet'   # the one-time link that creates the owner account
services:
  posture:
    image: ghcr.io/openasy/posture:0.6.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:8080:8080" # UI and API; put a TLS proxy in front to reach it from elsewhere
    volumes:
      - posture-data:/data # SQLite database: targets, reports, scores, failed controls and decisions
      # - ./inventory:/config/inventory:ro   # the install's servers, to see which ones have no posture scan
    secrets:
      - openasy-kek # mounted at /run/secrets/openasy-kek
    environment:
      # The install's hosts file (ADR 0052), to list servers with no posture scan:
      # OPENASY_HOSTS: /config/inventory/hosts.yaml
      # The address people open Posture at; with a TLS proxy in front, its https:// URL.
      POSTURE_PUBLIC_URL: ${POSTURE_PUBLIC_URL:-http://localhost:8080}
      # For CI: it can send reports and nothing else. Or use an API token with the editor role from Settings.
      POSTURE_INGEST_TOKEN: ${POSTURE_INGEST_TOKEN:-}
      # Sign in with your identity provider (OIDC), see the README:
      # OPENASY_OIDC_ISSUER: https://login.example.com
      # OPENASY_OIDC_CLIENT_ID: posture
      # OPENASY_OIDC_CLIENT_SECRET: ${OPENASY_OIDC_CLIENT_SECRET}

volumes:
  posture-data:

secrets:
  openasy-kek:
    file: ./openasy-kek
